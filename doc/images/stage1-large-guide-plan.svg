<text x="24" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">순서 · 구역</text>
<text x="214" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">역할</text>
<text x="284" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">새 경험</text>
<text x="614" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">다시 쓰기</text>
<text x="914" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">섞기</text>
<text x="1104" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">길 안내</text>
<text x="1274" y="142" font-size="12" fill="#333" font-weight="bold" text-anchor="start">검사</text>
<rect x="20" y="150" width="1400" height="70" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="168" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">1. A (작은)</text>
<text x="28" y="185" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 0%</text>
<rect x="214" y="156" width="58" height="18" rx="9" fill="#2f8f5b"/>
<text x="243" y="169" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">안전</text>
<text x="286" y="168" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 스위치로 문 열기</text>
<text x="1106" y="168" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="1106" y="185" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">길 모양(좁아지는 길 · 열린 문)</text>
<text x="28" y="214" font-size="10" fill="#777" font-weight="normal" text-anchor="start">세이프룸. 스위치로 문을 열면 문밖 거리 첫 가로등이 켜진 채 보인다.</text>
<rect x="20" y="224" width="1400" height="104" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="242" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">2. B (큰)</text>
<text x="28" y="259" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 8%</text>
<rect x="214" y="230" width="58" height="18" rx="9" fill="#c8642a"/>
<text x="243" y="243" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">교전</text>
<text x="286" y="242" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 잠든 무리</text>
<text x="286" y="259" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 경계형 무리</text>
<text x="286" y="276" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">• 낮은 엄폐물</text>
<text x="286" y="293" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 시간 습격</text>
<text x="1106" y="242" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="1276" y="242" font-size="12" fill="#c07a12" font-weight="bold" text-anchor="start">W1</text>
<text x="28" y="322" font-size="10" fill="#777" font-weight="normal" text-anchor="start">첫 큰 구역은 기본만: 잠든 무리를 깨우지 않고 지나갈지 먼저 칠지, 경계형 무리를 방벽 뒤에서. 가로등을 주 경로 쪽에 줄지어 두고 광장 끝 출구를 가장 밝게. (창고 간판은 B에서는 60 m 넘게 떨어져 화면에 들어오지 않아 C 골목 출구의 길 안내로 옮김 — 2026-10-27 배치 렌더.) 시간 무리도 이 구역부터(2026-10-27 플레이 뒤 사용자 결정: 큰 구역마다 약 2분 · 압박) — 새 경험 4개라 W1 경고를 남긴다. 주 경로 위에 경계형 3마리 무리 둘(피해 갈 수 없는 작은 교전).</text>
<rect x="20" y="332" width="1400" height="70" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="350" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">3. B-pharmacy (작은)</text>
<text x="28" y="367" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 18%</text>
<rect x="214" y="338" width="58" height="18" rx="9" fill="#2f6fb5"/>
<text x="243" y="351" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">탐색</text>
<text x="286" y="350" font-size="12" fill="#3f7f3f" font-weight="normal" text-anchor="start">• 보상 분기</text>
<text x="616" y="350" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 잠든 무리</text>
<text x="1106" y="350" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="28" y="396" font-size="10" fill="#777" font-weight="normal" text-anchor="start">약국 간판 불빛으로 곁길이 있음을 알림. 안에 잠든 무리 하나와 보급.</text>
<rect x="20" y="406" width="1400" height="87" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="424" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">4. C (작은)</text>
<text x="28" y="441" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 27%</text>
<rect x="214" y="412" width="58" height="18" rx="9" fill="#8a8f98"/>
<text x="243" y="425" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">이동</text>
<text x="286" y="424" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">• 좁은 통로</text>
<text x="286" y="441" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 경보 함정</text>
<text x="286" y="458" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 파괴 벽 뚫기</text>
<text x="616" y="424" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 경계형 무리</text>
<text x="1106" y="424" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">길 모양(좁아지는 길 · 열린 문)</text>
<text x="1106" y="441" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="1106" y="458" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">랜드마크(멀리서 보이는 큰 것)</text>
<text x="28" y="487" font-size="10" fill="#777" font-weight="normal" text-anchor="start">골목 입구에 경보 차(B에서 옮김): 좁은 길에서 건드리면 앞뒤로 몰려오는 짧고 피할 수 있는 위기. 골목 끝 조명. 골목을 나서면 북쪽에 창고 간판(전구 테두리 · 상자 그림 · 동쪽 화살표, 앞에 따뜻한 조명)이 다음 큰 구역 D 쪽을 가리킴. 골목 입구는 콘크리트 판 바리케이드로 막혀 있고 가운데 금 간 판 앞에 드럼통 — 쏘면 터져 길이 열린다(드럼통으로 길 뚫기 학습, 폭발 소리가 골목 무리를 깨움).</text>
<rect x="20" y="497" width="1400" height="87" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="515" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">5. D (큰)</text>
<text x="28" y="532" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 42%</text>
<rect x="214" y="503" width="58" height="18" rx="9" fill="#c8322a"/>
<text x="243" y="516" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">정점</text>
<text x="286" y="515" font-size="12" fill="#1f6f8b" font-weight="normal" text-anchor="start">• 경사로로 단 오르내리기</text>
<text x="286" y="532" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 제어판 크레센도</text>
<text x="286" y="549" font-size="12" fill="#3f7f3f" font-weight="normal" text-anchor="start">• 임무 왕복</text>
<text x="616" y="515" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 잠든 무리</text>
<text x="616" y="532" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 경계형 무리</text>
<text x="616" y="549" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 시간 습격</text>
<text x="916" y="515" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">좁은 통로 + 낮은 엄폐물</text>
<text x="1106" y="515" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">목표 표시(지도 · 화면)</text>
<text x="1106" y="532" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="1106" y="549" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">랜드마크(멀리서 보이는 큰 것)</text>
<text x="1276" y="515" font-size="12" fill="#c07a12" font-weight="bold" text-anchor="start">W2</text>
<text x="28" y="578" font-size="10" fill="#777" font-weight="normal" text-anchor="start">정점. 경사로로 하역장에 올라 셔터 제어판을 켜고 크레센도를 버틴다 — 하역장 입구를 좁히고 방벽을 둬 C · B에서 배운 '좁은 길 + 엄폐'로 지키게. 제어판 위 조명, 돌아오는 길 재등장. 크레센도는 Stage 2(벙커 철문)에서 다시(W2).</text>
<rect x="20" y="588" width="1400" height="70" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="606" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">6. E (작은)</text>
<text x="28" y="623" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 58%</text>
<rect x="214" y="594" width="58" height="18" rx="9" fill="#59a96a"/>
<text x="243" y="607" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">휴식</text>
<text x="286" y="606" font-size="12" fill="#3f7f3f" font-weight="normal" text-anchor="start">• 중간 안전 구역</text>
<text x="1106" y="606" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="28" y="652" font-size="10" fill="#777" font-weight="normal" text-anchor="start">경비 초소, 정점 바로 뒤 휴식. 따뜻한 색 조명(L4D 세이프룸 색).</text>
<rect x="20" y="662" width="1400" height="104" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="680" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">7. F (큰)</text>
<text x="28" y="697" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 72%</text>
<rect x="214" y="668" width="58" height="18" rx="9" fill="#c8642a"/>
<text x="243" y="681" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">교전</text>
<text x="286" y="680" font-size="12" fill="#1f6f8b" font-weight="normal" text-anchor="start">• 사다리 오르기</text>
<text x="286" y="697" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">• 높은 단 교전</text>
<text x="616" y="680" font-size="12" fill="#1f6f8b" font-weight="normal" text-anchor="start">• 경사로로 단 오르내리기</text>
<text x="616" y="697" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 잠든 무리</text>
<text x="616" y="714" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 경계형 무리</text>
<text x="616" y="731" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 시간 습격</text>
<text x="916" y="680" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">경보 함정 + 경사로로 단 오르내리기</text>
<text x="916" y="697" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">낮은 엄폐물 + 경계형 무리</text>
<text x="1106" y="680" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">랜드마크(멀리서 보이는 큰 것)</text>
<text x="1106" y="697" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">조명(빛으로 이끔)</text>
<text x="1276" y="680" font-size="12" fill="#c07a12" font-weight="bold" text-anchor="start">W2</text>
<text x="28" y="760" font-size="10" fill="#777" font-weight="normal" text-anchor="start">사다리로 컨테이너 위에 올라 위에서 쏘기를 처음. 시간 습격은 이 구역부터(B · D에서는 뺌). 경보 트럭이 울리면 경사로 위 단으로 올라가 버티기. 크레인이 랜드마크, 크레인 조명이 출구 쪽. 사다리 · 시간 습격은 Stage 2에서 다시(W2). (시간 무리는 B부터로 바뀜, 여기선 다시 쓰기.)</text>
<rect x="20" y="770" width="1400" height="70" fill="#ffffff" stroke="#00000014"/>
<text x="28" y="788" font-size="13" fill="#1f1f1f" font-weight="bold" text-anchor="start">8. G (작은)</text>
<text x="28" y="805" font-size="11" fill="#555" font-weight="normal" text-anchor="start">진행 88%</text>
<rect x="214" y="776" width="58" height="18" rx="9" fill="#8a8f98"/>
<text x="243" y="789" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">이동</text>
<text x="286" y="788" font-size="12" fill="#a02c2c" font-weight="normal" text-anchor="start">• 특수 적</text>
<text x="286" y="805" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 폭발 드럼통</text>
<text x="616" y="788" font-size="12" fill="#1f6f8b" font-weight="normal" text-anchor="start">• 경사로로 단 오르내리기</text>
<text x="616" y="805" font-size="12" fill="#b5651d" font-weight="normal" text-anchor="start">• 파괴 벽 뚫기</text>
<text x="916" y="788" font-size="12" fill="#5b4a9c" font-weight="normal" text-anchor="start">높은 단 교전 + 낮은 엄폐물</text>
<text x="1106" y="788" font-size="12" fill="#2f6f3f" font-weight="normal" text-anchor="start">길 모양(좁아지는 길 · 열린 문)</text>
