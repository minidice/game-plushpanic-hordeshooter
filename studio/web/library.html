<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plush Panic Studio · 도감</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/library.css"><script type="module" src="/library.js"></script></head>
<body>
<header><a class="brand" href="/">PLUSH PANIC <span>STUDIO</span></a><span class="local"><i></i> LOCAL WORKSPACE</span><button id="reload">로컬 데이터 다시 읽기 ↻</button></header>
<main>
  <nav class="main-nav" aria-label="Studio 메뉴"><a href="/">캐릭터</a><a href="/monsters">몬스터</a><a href="/objects">오브젝트</a><a href="/weapons">무기</a><a href="/effects">이펙트</a><a href="/statuses">상태이상</a><a href="/sounds">사운드</a></nav>
  <div class="heading"><div><p id="eyebrow" class="eyebrow">LOCAL LIBRARY</p><h1 id="page-title">게임 도감</h1><p id="intro">현재 로컬 게임의 모습과 속성</p></div><span class="tag" id="total-count">불러오는 중</span></div>
  <p id="warnings" class="warning" hidden></p>
  <div class="library-layout">
    <aside class="library-sidebar"><div class="search-box"><label for="search">목록 검색</label><input id="search" type="search" placeholder="이름 또는 ID 검색"><label class="filter-label" for="category">분류</label><select id="category"><option value="">모든 분류</option></select><p id="result-count" aria-live="polite"></p></div><div id="entries" class="entries" aria-label="항목 목록"></div></aside>
    <section class="library-main" aria-label="선택 항목 상세">
      <div class="library-preview"><div class="preview-top"><span class="live-dot"></span><span>GODOT · ACTUAL RENDER</span><span id="render-time"></span></div><div class="canvas"><img id="preview" alt="선택 항목 실제 게임 렌더" hidden><div id="comparison" hidden aria-label="고품질 저품질 비교"></div><div id="placeholder">목록에서 항목을 선택하세요.</div><span id="pending" hidden>실제 게임 렌더 중</span></div>
        <p id="quality-note" hidden>같은 시점·조명·크기 기준 · 삼각형은 자동 LOD 적용 전 원본 메시 합계</p>
        <div class="camera-controls"><label>회전 <input id="rotation" type="range" min="-180" max="180" value="-25"><output id="rotation-value">−25°</output></label><label>확대 <input id="zoom" type="range" min="0.75" max="1.45" step="0.01" value="1"><output id="zoom-value">1.00×</output></label></div>
        <label id="variant-row" hidden><span id="variant-label">감염체 기준 종</span> <select id="variant"></select></label>
      </div>
      <div class="item-info">
      <div class="item-heading"><div><span id="item-category" class="eyebrow"></span><h2 id="item-name">선택 항목</h2></div><code id="item-id"></code></div>
      <p id="summary" class="summary"></p><p id="render-error" class="warning" hidden></p>
      <section class="properties"><h3>속성 정보</h3><table><tbody id="properties"></tbody></table></section>
      <div id="details" class="raw-details"></div>
      <p class="source"><span>원본 위치</span><code id="source"></code></p>
      </div>
    </section>
  </div>
  <footer><span id="status" role="status" aria-live="polite">현재 게임 데이터 연결 중…</span><span id="loaded-at"></span></footer>
</main></body></html>
