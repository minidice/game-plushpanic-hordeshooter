<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이콘 크기 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#e8edf2;color:#182334;font-family:Segoe UI,Malgun Gothic,sans-serif}main{max-width:1050px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;color:#536276;margin:0 0 24px}section{border-radius:14px;padding:20px;margin:16px 0;background:#fff}.dark{background:#172334;color:#fff}h2{font-size:15px;margin:0 0 12px}.grid{display:grid;grid-template-columns:100px repeat(5,minmax(48px,1fr)) 136px;align-items:center;gap:8px}.label{font-size:13px}.size{text-align:center;font-size:12px;opacity:.65}.cell{height:140px;display:flex;align-items:center;justify-content:center}img{display:block;max-width:none;object-fit:contain}.note{font-size:12px;margin-top:18px;line-height:1.6}
</style><main><h1>놀란 표정 · 아이콘 크기 비교</h1><p>원본 3종을 그대로 표시 크기만 줄였습니다. 각 이미지는 표시된 CSS 픽셀 크기이며, 브라우저 확대 100% 기준입니다.</p><div id="panels"></div><p class="note">시안 비교용 · 실행파일 아이콘 미적용 · 배경이 포함된 원본 PNG<br>작은 크기에서는 동물 구분 → 눈과 입 → 손과 표정 세부 순서로 확인하세요.</p></main>
<script>
const sizes=[16,24,32,48,64,128];const variants=[['라쿤','01-raccoon.png'],['거위','02-goose.png'],['라쿤 + 랫서판다','03-duo.png']];
for(const dark of [false,true]){const section=document.createElement('section');if(dark)section.className='dark';const title=document.createElement('h2');title.textContent=dark?'어두운 바탕':'밝은 바탕';section.append(title);const grid=document.createElement('div');grid.className='grid';grid.append(document.createElement('div'));for(const size of sizes){const head=document.createElement('div');head.className='size';head.textContent=size+' px';grid.append(head)}for(const [name,src]of variants){const label=document.createElement('div');label.className='label';label.textContent=name;grid.append(label);for(const size of sizes){const cell=document.createElement('div');cell.className='cell';const image=document.createElement('img');image.src=src;image.alt=name+' '+size+'px';image.width=size;image.height=size;cell.append(image);grid.append(cell)}}section.append(grid);document.querySelector('#panels').append(section)}
</script></html>
